[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isotherm-fit"
version = "0.2.0"
description = "Fit moisture sorption isotherm models (GAB, BET, Peleg) and estimate food stability from experimental water activity data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karen Khachatryan", email = "karen.khachatryan@gmail.com" },
]
keywords = [
    "sorption isotherm",
    "water activity",
    "GAB model",
    "BET model",
    "food stability",
    "monolayer moisture content",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
gui = [
    "customtkinter>=5.2",
]
build = [
    "pyinstaller>=6.0",
]
release = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/karenkhachatryan-lab/isotherm-fit"
Documentation = "https://karenkhachatryan-lab.github.io/isotherm-fit"
Issues = "https://github.com/karenkhachatryan-lab/isotherm-fit/issues"

[project.scripts]
isotherm-fit = "isotherm_fit.cli:app"
isotherm-fit-gui = "isotherm_fit.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isotherm_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
