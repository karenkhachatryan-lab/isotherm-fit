site_name: isotherm-fit
site_description: Automated fitting of moisture sorption isotherm models for food stability assessment
site_url: https://karenkhachatryan-lab.github.io/isotherm-fit
repo_url: https://github.com/karenkhachatryan-lab/isotherm-fit
repo_name: karenkhachatryan-lab/isotherm-fit

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - About: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Models: models.md
  - Cite: cite.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
